
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcademiSync AI | Modern Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --surface: #ffffff;
      --background: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #6366f1;
    }
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--background);
      color: var(--text-main);
    }
    
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      transition: all 0.2s ease;
    }
    .app-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* Modern Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid var(--background); }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .scroll-hide::-webkit-scrollbar { display: none; }
    
    .search-highlight {
      background-color: #fef08a;
      border-radius: 2px;
      font-weight: 600;
      padding: 0 2px;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@4.10.38",
    "fuse.js": "https://esm.sh/fuse.js@7.0.0"
  }
}
</script>
</head>
<body class="antialiased">
  <div id="root"></div>
</body>

</html>
